---
name: Build container image
on:
  #schedule:
  #  - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      fedora_version:
        description: "Fedora base image"
        required: false
        default: "45"
        type: choice
        options:
          - "44"
          - "45"
          - "rawhide"
      enable_common:
        description: "Common"
        required: false
        default: true
        type: boolean
      enable_standard:
        description: "Standard"
        required: false
        default: true
        type: boolean
      enable_extended:
        description: "Extended"
        required: false
        default: true
        type: boolean
      enable_virttools:
        description: "Virtualization Tools"
        required: false
        default: true
        type: boolean
      enable_devtools:
        description: "Developer Tools"
        required: false
        default: true
        type: boolean
      enable_experimental:
        description: "Experimental"
        required: false
        default: false
        type: boolean
  # Called by build-lite.yml (and any other variant): same build, its own tags.
  workflow_call:
    inputs:
      variant:
        description: "Variant name: replaces the latest tag, prefixes the version tag and drops the fNN tag (empty = main image)"
        required: false
        default: ""
        type: string
      fedora_version:
        required: false
        default: "45"
        type: string
      default_fedora_version:
        description: "Fedora version that moves the default tag (latest / the variant name)"
        required: false
        default: "45"
        type: string
      enable_common:
        required: false
        default: true
        type: boolean
      enable_standard:
        required: false
        default: true
        type: boolean
      enable_extended:
        required: false
        default: true
        type: boolean
      enable_virttools:
        required: false
        default: true
        type: boolean
      enable_devtools:
        required: false
        default: true
        type: boolean
      enable_experimental:
        required: false
        default: false
        type: boolean

env:
  IMAGE_DESC: "HorizonOS - Customized Fedora Kinoite Image"
  IMAGE_KEYWORDS: "bootc,fedora,kinoite,atomic"
  IMAGE_LOGO_URL: "https://github.com/itotm/horizon-os/blob/main/logo.png"
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  # The tag installed systems follow: "latest" for the main image, the variant
  # name (e.g. "lite") when called from a variant workflow.
  DEFAULT_TAG: ${{ inputs.variant || 'latest' }}
  # Tags installed systems follow, never deleted by the cleanup steps whichever
  # workflow runs them: a variant build must not age out "latest" and vice versa.
  KEEP_TAGS: "latest lite dev"
  # Public half of SIGNING_SECRET; installed into the image from sys_files.
  COSIGN_PUBLIC_KEY: "sys_files/etc/pki/containers/horizon-os.pub"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get current date and version
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

          # Generate version in format AAAAMMGG.build
          BUILD_DATE=$(date -u +%Y%m%d)
          BUILD_NUMBER=${{ github.run_number }}
          VERSION="${BUILD_DATE}.${BUILD_NUMBER}"
          # A variant has its own run numbers: the prefix keeps its version
          # tags apart from the main image's (lite-20261106.3)
          VARIANT="${{ inputs.variant }}"
          VERSION="${VARIANT:+${VARIANT}-}${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Check if today is Friday (5 = Friday)
          DAY_OF_WEEK=$(date -u +%u)
          if [ "$DAY_OF_WEEK" = "5" ]; then
            echo "is_friday=true" >> $GITHUB_OUTPUT
          else
            echo "is_friday=false" >> $GITHUB_OUTPUT
          fi

          # Day parity for alternating Docker Hub / Quay.io pushes
          DAY_OF_MONTH=$(date -u +%d)
          # Strip leading zero to avoid octal interpretation
          DAY_NUM=$((10#$DAY_OF_MONTH))
          if [ $((DAY_NUM % 2)) -eq 0 ]; then
            echo "push_dockerhub=true" >> $GITHUB_OUTPUT
            echo "push_quay=false" >> $GITHUB_OUTPUT
          else
            echo "push_dockerhub=false" >> $GITHUB_OUTPUT
            echo "push_quay=true" >> $GITHUB_OUTPUT
          fi

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and version tag in format vAAAAMMGG.build.
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }},enable=${{ (inputs.fedora_version || '45') == (inputs.default_fedora_version || '45') }}
            type=raw,value=${{ steps.date.outputs.version }}
            type=raw,value=f${{ inputs.fedora_version || '45' }},enable=${{ inputs.variant == '' }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ steps.date.outputs.version }}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        env:
          METADATA_LABELS: ${{ steps.metadata.outputs.labels }}
        run: |
          set -euo pipefail

          # Pull the base up front so its digest is known before the build and
          # every label can be set in this single pass. Kinoite publishes no
          # per-build tag, so the exact base build is pinned by the digest and
          # spelled out by kinoite.version.
          BASE_IMAGE="quay.io/fedora/fedora-kinoite:${{ inputs.fedora_version || '45' }}"
          sudo buildah pull "$BASE_IMAGE"
          BASE_INFO=$(sudo buildah inspect --type image "$BASE_IMAGE")
          BASE_DIGEST=$(jq -r '.FromImageDigest // empty' <<< "$BASE_INFO")
          BASE_VERSION=$(jq -r '.OCIv1.config.Labels["org.opencontainers.image.version"] // empty' <<< "$BASE_INFO")
          echo "Base image: ${BASE_IMAGE} (${BASE_VERSION:-unknown}) @ ${BASE_DIGEST:-unknown}"

          LABEL_ARGS=()
          ANNOTATION_ARGS=()
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            LABEL_ARGS+=(--label "$line")
            ANNOTATION_ARGS+=(--annotation "$line")
          done <<< "$METADATA_LABELS"

          for pair in \
              "org.opencontainers.image.base.name=${BASE_IMAGE}" \
              "org.opencontainers.image.base.digest=${BASE_DIGEST:-}" \
              "kinoite.version=${BASE_VERSION:-}"; do
            [ -n "${pair#*=}" ] || continue
            LABEL_ARGS+=(--label "$pair")
            ANNOTATION_ARGS+=(--annotation "$pair")
          done

          # --format oci is buildah's default, but stating it explicitly guards
          # against a Docker-format manifest, where --annotation is silently dropped.
          sudo buildah build \
            --format oci \
            --file ./Containerfile \
            --build-arg FEDORA_VERSION=${{ inputs.fedora_version || '45' }} \
            --build-arg BUILD_NUMBER=${{ github.run_number }} \
            --build-arg IMAGE_VERSION=${{ steps.date.outputs.version }} \
            --build-arg ENABLE_COMMON=${{ inputs.enable_common }} \
            --build-arg ENABLE_STANDARD=${{ inputs.enable_standard }} \
            --build-arg ENABLE_EXTENDED=${{ inputs.enable_extended }} \
            --build-arg ENABLE_VIRTTOOLS=${{ inputs.enable_virttools }} \
            --build-arg ENABLE_DEVTOOLS=${{ inputs.enable_devtools }} \
            --build-arg ENABLE_EXPERIMENTAL=${{ inputs.enable_experimental }} \
            --tag localhost/${{ env.IMAGE_NAME }}:build \
            "${LABEL_ARGS[@]}" \
            "${ANNOTATION_ARGS[@]}" \
            .

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      #
      # chunkah rewrites the image in place (output-image defaults to source-image)
      # and carries over the config labels and manifest annotations set at build
      # time, base.name/base.digest included, so no metadata pass is needed after
      # it. The push below therefore reads the same :build tag either way.
      - name: Run Rechunker
        id: rechunk
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: projectbluefin/actions/bootc-build/chunka@fdd67230905f523fa64f9b043a5151293978dec4 # v1
        with:
          # Use the local-only tag, not the ghcr.io-qualified one: buildah's --from
          # treats a registry-qualified reference to a mutable tag (e.g. `:latest`)
          # as remotely resolvable and will pull it from GHCR instead of using the
          # image just built in local storage.
          source-image: "localhost/${{ env.IMAGE_NAME }}:build"
          max-layers: "128"

      - name: Inspect final image
        run: |
          set -euo pipefail
          IMAGE="containers-storage:localhost/${{ env.IMAGE_NAME }}:build"
          echo "Image size: $(sudo buildah images --format '{{.Size}}' localhost/${{ env.IMAGE_NAME }}:build | head -n 1)"
          echo "Layers: $(sudo skopeo inspect --raw "$IMAGE" | jq '.layers | length')"
          echo "Final labels:"
          sudo skopeo inspect "$IMAGE" | jq '.Labels'
          echo "Final annotations:"
          sudo skopeo inspect --raw "$IMAGE" | jq '.annotations'
          echo "Signature policy files:"
          sudo podman run --rm localhost/${{ env.IMAGE_NAME }}:build ls -l \
            /etc/pki/containers/horizon-os.pub \
            /etc/containers/policy.json \
            /etc/containers/registries.d/horizon-os.yaml

      - name: Install Cosign
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # be careful when upgrading major versions
          cosign-release: "v3.1.2"

      # Once an image ships policy.json, every later `bootc upgrade` demands a
      # signature that /etc/pki/containers/horizon-os.pub can check, so a key
      # pair mismatch would leave every installed system unable to update. Fail
      # here, before anything is pushed, rather than in the field.
      - name: Check signing key
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          cosign public-key --key env://COSIGN_PRIVATE_KEY | diff - "$COSIGN_PUBLIC_KEY"
          echo "SIGNING_SECRET matches ${COSIGN_PUBLIC_KEY}"

      # cosign resolves registry credentials through go-containerregistry, which
      # reads ~/.docker/config.json and never sees what `sudo skopeo login`
      # stores under /run/containers/0/auth.json. Each registry therefore gets a
      # second, docker-style login next to the skopeo one the push steps keep
      # using.
      - name: Login to GHCR (for cosign)
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Copying out of containers-storage recompresses the layers on every call,
      # which yields a different manifest digest each time and would publish the
      # same content as several distinct package versions. Copy once, capture the
      # digest, then point the remaining tags at that same manifest with
      # registry-to-registry copies.
      #
      # Only the per-build version tag is pushed here: the tags installed
      # systems follow (latest, f45) are moved by "Tag image" once the
      # signature exists. A run that dies in between (timeout, dropped
      # connection) then leaves them on the previous, signed image instead of
      # an unsigned one that every `bootc upgrade` would reject.
      - name: Push To GHCR
        id: push_ghcr
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail

          REPO="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"

          echo "${{ secrets.GITHUB_TOKEN }}" | sudo skopeo login ghcr.io -u ${{ github.actor }} --password-stdin

          sudo skopeo copy --digestfile /tmp/ghcr-digest \
            containers-storage:localhost/${{ env.IMAGE_NAME }}:build \
            "docker://${REPO}:${{ steps.date.outputs.version }}"
          DIGEST=$(cat /tmp/ghcr-digest)
          echo "Pushed ${REPO}:${{ steps.date.outputs.version }} -> ${DIGEST}"

          echo "repo=${REPO}" >> $GITHUB_OUTPUT
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "ref=docker://${REPO}@${DIGEST}" >> $GITHUB_OUTPUT

      # The signature is a separate manifest, tagged sha256-<digest>.sig in the
      # same repository, so it is uploaded after the image and, being bound to
      # the digest, covers every tag that points at it. cosign 3.x defaults to
      # the new bundle format, which containers/image cannot read yet, hence the
      # two compatibility flags:
      # https://github.com/containers/container-libs/issues/388
      # https://github.com/coreos/rpm-ostree/issues/5509
      - name: Sign image (GHCR)
        if: steps.push_ghcr.outcome == 'success'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          SIGN_REF: ${{ steps.push_ghcr.outputs.repo }}@${{ steps.push_ghcr.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$SIGN_REF"
          cosign verify --key "$COSIGN_PUBLIC_KEY" "$SIGN_REF"

      - name: Tag image (GHCR)
        if: steps.push_ghcr.outcome == 'success'
        run: |
          set -euo pipefail
          REPO="${{ steps.push_ghcr.outputs.repo }}"
          DIGEST="${{ steps.push_ghcr.outputs.digest }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            [ "$tag" != "${{ steps.date.outputs.version }}" ] || continue
            sudo skopeo copy "docker://${REPO}@${DIGEST}" "docker://${REPO}:${tag}"
            echo "Tagged ${REPO}:${tag} -> ${DIGEST}"
          done

      - name: Delete old images from GHCR
        if: steps.push_ghcr.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          CUTOFF_DATE=$(date -u -d '30 days ago' +%s)
          VERSIONS_FILE="${RUNNER_TEMP}/ghcr-versions.tsv"
          # jq condition true for any tag in KEEP_TAGS: . == "latest" or . == "lite" ...
          KEEP_FILTER=$(printf '. == "%s" or ' ${KEEP_TAGS})
          KEEP_FILTER="${KEEP_FILTER% or }"
          echo "Fetching versions for ${PACKAGE_NAME}..."

          # `gh api` paginates on its own and fails the step on a non-2xx response,
          # unlike a bare `curl -s`. All versions are listed before anything is
          # deleted. Per version: id, digest, last update, whether it carries a
          # tag in KEEP_TAGS (exact match, so `latest-foo` is not protected), the
          # digest a signature (tagged sha256-<digest>.sig) covers, and the tags.
          # Empty fields are written as "-": read would merge two tabs in a row.
          gh api --paginate "/user/packages/container/${PACKAGE_NAME}/versions" \
            --jq ".[]
                  | (.metadata.container.tags // []) as \$t
                  | [.id, .name, .updated_at,
                     (\$t | any(${KEEP_FILTER}) | tostring),
                     (\$t | map(select(test(\"^sha256-[0-9a-f]{64}[.]sig\$\")) | .[7:71]) | first // \"-\"),
                     (\$t | join(\",\") | if . == \"\" then \"-\" else . end)]
                  | @tsv" \
            > "$VERSIONS_FILE"

          # Old versions. Kept tags never age out, and signatures are left to the
          # next pass: their timestamp never moves, so the one covering `latest`
          # would go while the image stays, breaking verification on every
          # installed system. An unreadable date counts as recent.
          KEPT_DIGESTS=" "
          while IFS=$'\t' read -r VERSION_ID DIGEST UPDATED_AT KEEP SIGNED TAGS; do
            [ "$SIGNED" = "-" ] || continue
            VERSION_TS=$(date -u -d "$UPDATED_AT" +%s 2>/dev/null || echo "$CUTOFF_DATE")
            if [ "$KEEP" = "false" ] && [ "$VERSION_TS" -lt "$CUTOFF_DATE" ]; then
              echo "Deleting version ID: ${VERSION_ID} (tags: ${TAGS/#-/<untagged>}, updated: ${UPDATED_AT})"
              gh api --silent --method DELETE \
                "/user/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}"
            else
              KEPT_DIGESTS+="${DIGEST} "
            fi
          done < "$VERSIONS_FILE"

          # Signatures of images no longer in the package. With no image left at
          # all something went wrong with the listing: touch nothing.
          if [ "$KEPT_DIGESTS" = " " ]; then
            echo "No image left, signatures not touched."
            exit 0
          fi
          while IFS=$'\t' read -r VERSION_ID _ _ _ SIGNED TAGS; do
            [ "$SIGNED" != "-" ] || continue
            [[ "$KEPT_DIGESTS" != *" sha256:${SIGNED} "* ]] || continue
            echo "Deleting orphaned signature: version ID ${VERSION_ID} (${TAGS})"
            gh api --silent --method DELETE \
              "/user/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}"
          done < "$VERSIONS_FILE"

          echo "GHCR cleanup complete."

      - name: Login to Docker Hub
        if: steps.push_ghcr.outcome == 'success' && steps.date.outputs.push_dockerhub == 'true'
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo skopeo login docker.io \
            -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Login to Docker Hub (for cosign)
        if: steps.push_ghcr.outcome == 'success' && steps.date.outputs.push_dockerhub == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Mirroring from the GHCR digest instead of containers-storage keeps the same
      # manifest digest across all registries and skips a full re-upload.
      #
      # skopeo copies the image manifest only, never the signature tag next to
      # it, so each mirror is signed on its own. The digest is read back from the
      # mirror rather than assumed equal to GHCR's, so the signature always
      # matches what actually landed there. As on GHCR, only the version tag is
      # pushed before signing and the others follow once it is signed.
      - name: Push To Docker Hub
        id: push_dockerhub
        if: steps.push_ghcr.outcome == 'success' && steps.date.outputs.push_dockerhub == 'true'
        run: |
          set -euo pipefail
          SRC="${{ steps.push_ghcr.outputs.ref }}"
          REPO="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          sudo skopeo copy --digestfile /tmp/dockerhub-digest "$SRC" \
            "docker://${REPO}:${{ steps.date.outputs.version }}"
          DIGEST=$(cat /tmp/dockerhub-digest)
          echo "Pushed ${REPO} -> ${DIGEST} (GHCR: ${{ steps.push_ghcr.outputs.digest }})"
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Sign image (Docker Hub)
        if: steps.push_dockerhub.outcome == 'success' && steps.date.outputs.push_dockerhub == 'true'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          SIGN_REF: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}@${{ steps.push_dockerhub.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$SIGN_REF"
          cosign verify --key "$COSIGN_PUBLIC_KEY" "$SIGN_REF"

      - name: Tag image (Docker Hub)
        if: steps.push_dockerhub.outcome == 'success' && steps.date.outputs.push_dockerhub == 'true'
        run: |
          set -euo pipefail
          REPO="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          DIGEST="${{ steps.push_dockerhub.outputs.digest }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            [ "$tag" != "${{ steps.date.outputs.version }}" ] || continue
            sudo skopeo copy "docker://${REPO}@${DIGEST}" "docker://${REPO}:${tag}"
            echo "Tagged ${REPO}:${tag} -> ${DIGEST}"
          done

      # Tags are removed one by one through the Hub API, never with
      # `skopeo delete`: that removes the manifest a tag points to, and with it
      # every other tag on the same digest (a kept tag included), so the next
      # delete of one of those fails because the image is already gone.
      # All tags are listed before anything is deleted, so deleting does not
      # shift the pages still to read.
      - name: Delete old images from Docker Hub
        if: steps.push_dockerhub.outcome == 'success' && steps.date.outputs.push_dockerhub == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          DOCKERHUB_REPO="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          API="https://hub.docker.com/v2/repositories/${DOCKERHUB_REPO}/tags"
          CUTOFF_DATE=$(date -u -d '15 days ago' +%s)
          TAGS_FILE="${RUNNER_TEMP}/dockerhub-tags.tsv"

          TOKEN=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username: $u, password: $p}' \
            | curl -fsS -H "Content-Type: application/json" -X POST -d @- "https://hub.docker.com/v2/users/login/" \
            | jq -r '.token')

          echo "Fetching tags for ${DOCKERHUB_REPO}..."
          : > "$TAGS_FILE"
          PAGE_URL="${API}/?page_size=100"
          while [ -n "$PAGE_URL" ]; do
            RESPONSE=$(curl -fsS -H "Authorization: Bearer ${TOKEN}" "$PAGE_URL")
            jq -r '.results[] | [.name, .digest, .last_updated] | @tsv' <<< "$RESPONSE" >> "$TAGS_FILE"
            PAGE_URL=$(jq -r '.next // empty' <<< "$RESPONSE")
          done

          # Old tags. The tags in KEEP_TAGS never age out, and the signatures
          # (sha256-<digest>.sig) are left to the next pass: their timestamp
          # never moves, so the one covering a kept tag would go while the
          # image stays. An unreadable date counts as recent.
          KEPT_DIGESTS=" "
          while IFS=$'\t' read -r TAG_NAME DIGEST LAST_UPDATED; do
            case "$TAG_NAME" in sha256-*) continue ;; esac
            TAG_TS=$(date -u -d "$LAST_UPDATED" +%s 2>/dev/null || echo "$CUTOFF_DATE")
            if [[ " ${KEEP_TAGS} " != *" ${TAG_NAME} "* ]] && [ "$TAG_TS" -lt "$CUTOFF_DATE" ]; then
              echo "Deleting tag: ${TAG_NAME} (updated: ${LAST_UPDATED})"
              curl -fsS -X DELETE -H "Authorization: Bearer ${TOKEN}" "${API}/${TAG_NAME}/"
            else
              KEPT_DIGESTS+="${DIGEST} "
            fi
          done < "$TAGS_FILE"

          # Signatures of images no remaining tag points to. With no tag left
          # at all something went wrong with the listing: touch nothing.
          if [ "$KEPT_DIGESTS" = " " ]; then
            echo "No tag left, signatures not touched."
            exit 0
          fi
          while IFS=$'\t' read -r TAG_NAME _ _; do
            [[ "$TAG_NAME" =~ ^sha256-([0-9a-f]{64})\.sig$ ]] || continue
            [[ "$KEPT_DIGESTS" != *" sha256:${BASH_REMATCH[1]} "* ]] || continue
            echo "Deleting orphaned signature: ${TAG_NAME}"
            curl -fsS -X DELETE -H "Authorization: Bearer ${TOKEN}" "${API}/${TAG_NAME}/"
          done < "$TAGS_FILE"

          echo "Docker Hub cleanup complete."

      - name: Login to Quay.io
        if: steps.push_ghcr.outcome == 'success' && steps.date.outputs.push_quay == 'true'
        run: |
          echo "${{ secrets.QUAY_TOKEN }}" | sudo skopeo login quay.io \
            -u ${{ secrets.QUAY_USERNAME }} --password-stdin

      - name: Login to Quay.io (for cosign)
        if: steps.push_ghcr.outcome == 'success' && steps.date.outputs.push_quay == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Push To Quay.io
        id: push_quay
        if: steps.push_ghcr.outcome == 'success' && steps.date.outputs.push_quay == 'true'
        run: |
          set -euo pipefail
          SRC="${{ steps.push_ghcr.outputs.ref }}"
          REPO="quay.io/${{ secrets.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}"
          sudo skopeo copy --digestfile /tmp/quay-digest "$SRC" \
            "docker://${REPO}:${{ steps.date.outputs.version }}"
          DIGEST=$(cat /tmp/quay-digest)
          echo "Pushed ${REPO} -> ${DIGEST} (GHCR: ${{ steps.push_ghcr.outputs.digest }})"
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Sign image (Quay.io)
        if: steps.push_quay.outcome == 'success' && steps.date.outputs.push_quay == 'true'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          SIGN_REF: quay.io/${{ secrets.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}@${{ steps.push_quay.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$SIGN_REF"
          cosign verify --key "$COSIGN_PUBLIC_KEY" "$SIGN_REF"

      - name: Tag image (Quay.io)
        if: steps.push_quay.outcome == 'success' && steps.date.outputs.push_quay == 'true'
        run: |
          set -euo pipefail
          REPO="quay.io/${{ secrets.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}"
          DIGEST="${{ steps.push_quay.outputs.digest }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            [ "$tag" != "${{ steps.date.outputs.version }}" ] || continue
            sudo skopeo copy "docker://${REPO}@${DIGEST}" "docker://${REPO}:${tag}"
            echo "Tagged ${REPO}:${tag} -> ${DIGEST}"
          done

      # Same as the Docker Hub cleanup, through the Quay API.
      - name: Delete old images from Quay.io
        if: steps.push_quay.outcome == 'success' && steps.date.outputs.push_quay == 'true'
        env:
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          QUAY_NAMESPACE: ${{ secrets.QUAY_NAMESPACE }}
        run: |
          set -euo pipefail
          QUAY_REPO="${QUAY_NAMESPACE}/${IMAGE_NAME}"
          API="https://quay.io/api/v1/repository/${QUAY_REPO}/tag"
          CUTOFF_DATE=$(date -u -d '15 days ago' +%s)
          TAGS_FILE="${RUNNER_TEMP}/quay-tags.tsv"

          echo "Fetching tags for ${QUAY_REPO}..."
          : > "$TAGS_FILE"
          PAGE=1
          while true; do
            RESPONSE=$(curl -fsS -H "Authorization: Bearer ${QUAY_TOKEN}" \
              "${API}/?page=${PAGE}&limit=100&onlyActiveTags=true")
            jq -r '.tags[] | [.name, .manifest_digest, .start_ts] | @tsv' <<< "$RESPONSE" >> "$TAGS_FILE"
            [ "$(jq -r '.has_additional // false' <<< "$RESPONSE")" = "true" ] || break
            PAGE=$((PAGE + 1))
          done

          # Old tags; kept tags and signatures as in the Docker Hub step.
          KEPT_DIGESTS=" "
          while IFS=$'\t' read -r TAG_NAME DIGEST TAG_TS; do
            case "$TAG_NAME" in sha256-*) continue ;; esac
            if [[ " ${KEEP_TAGS} " != *" ${TAG_NAME} "* ]] && [ "$TAG_TS" -lt "$CUTOFF_DATE" ]; then
              echo "Deleting tag: ${TAG_NAME} (created: $(date -u -d "@${TAG_TS}" +%Y-%m-%d))"
              curl -fsS -X DELETE -H "Authorization: Bearer ${QUAY_TOKEN}" "${API}/${TAG_NAME}"
            else
              KEPT_DIGESTS+="${DIGEST} "
            fi
          done < "$TAGS_FILE"

          # Signatures of images no remaining tag points to.
          if [ "$KEPT_DIGESTS" = " " ]; then
            echo "No tag left, signatures not touched."
            exit 0
          fi
          while IFS=$'\t' read -r TAG_NAME _ _; do
            [[ "$TAG_NAME" =~ ^sha256-([0-9a-f]{64})\.sig$ ]] || continue
            [[ "$KEPT_DIGESTS" != *" sha256:${BASH_REMATCH[1]} "* ]] || continue
            echo "Deleting orphaned signature: ${TAG_NAME}"
            curl -fsS -X DELETE -H "Authorization: Bearer ${QUAY_TOKEN}" "${API}/${TAG_NAME}"
          done < "$TAGS_FILE"

          echo "Quay.io cleanup complete."
