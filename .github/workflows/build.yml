---
name: Build container image
on:
  #schedule:
  #  - cron: "5 0 * * *"
  workflow_dispatch:
    inputs:
      fedora_version:
        description: "Fedora base image"
        required: false
        default: "44"
        type: choice
        options:
          - "44"
          - "45"
          - "rawhide"
      enable_common:
        description: "Common"
        required: false
        default: true
        type: boolean
      enable_standard:
        description: "Standard"
        required: false
        default: true
        type: boolean
      enable_virttools:
        description: "Virtualization Tools"
        required: false
        default: true
        type: boolean
      enable_devtools:
        description: "Developer Tools"
        required: false
        default: true
        type: boolean
      enable_experimental:
        description: "Experimental"
        required: false
        default: false
        type: boolean
      # Keep the default in sync with the fallback in the "Run Rechunker
      # (chunkah)" condition below: scheduled runs send no input at all.
      rechunk:
        description: "Rechunk method"
        required: false
        default: "chunkah"
        type: choice
        options:
          - "none"
          - "rpm-ostree"
          - "chunkah"

env:
  IMAGE_DESC: "HorizonOS - Customized Fedora Kinoite Image"
  IMAGE_KEYWORDS: "bootc,fedora,kinoite,atomic"
  IMAGE_LOGO_URL: "https://github.com/itotm/horizon-os/blob/main/logo.png"
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get current date and version
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

          # Generate version in format AAAAMMGG.build
          BUILD_DATE=$(date -u +%Y%m%d)
          BUILD_NUMBER=${{ github.run_number }}
          VERSION="${BUILD_DATE}.${BUILD_NUMBER}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Check if today is Friday (5 = Friday)
          DAY_OF_WEEK=$(date -u +%u)
          if [ "$DAY_OF_WEEK" = "5" ]; then
            echo "is_friday=true" >> $GITHUB_OUTPUT
          else
            echo "is_friday=false" >> $GITHUB_OUTPUT
          fi

          # Day parity for alternating Docker Hub / Quay.io pushes
          DAY_OF_MONTH=$(date -u +%d)
          # Strip leading zero to avoid octal interpretation
          DAY_NUM=$((10#$DAY_OF_MONTH))
          if [ $((DAY_NUM % 2)) -eq 0 ]; then
            echo "push_dockerhub=true" >> $GITHUB_OUTPUT
            echo "push_quay=false" >> $GITHUB_OUTPUT
          else
            echo "push_dockerhub=false" >> $GITHUB_OUTPUT
            echo "push_quay=true" >> $GITHUB_OUTPUT
          fi

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and version tag in format vAAAAMMGG.build.
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }},enable=${{ inputs.fedora_version == '' || inputs.fedora_version == '44' }}
            type=raw,value=${{ steps.date.outputs.version }}
            type=raw,value=f${{ inputs.fedora_version || '44' }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ steps.date.outputs.version }}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        env:
          METADATA_LABELS: ${{ steps.metadata.outputs.labels }}
        run: |
          set -euo pipefail

          LABEL_ARGS=()
          ANNOTATION_ARGS=()
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            LABEL_ARGS+=(--label "$line")
            ANNOTATION_ARGS+=(--annotation "$line")
          done <<< "$METADATA_LABELS"

          # --format oci is buildah's default, but stating it explicitly guards
          # against a Docker-format manifest, where --annotation is silently dropped.
          sudo buildah build \
            --format oci \
            --file ./Containerfile \
            --build-arg FEDORA_VERSION=${{ github.event.inputs.fedora_version || '44' }} \
            --build-arg BUILD_NUMBER=${{ github.run_number }} \
            --build-arg IMAGE_VERSION=${{ steps.date.outputs.version }} \
            --build-arg ENABLE_COMMON=${{ github.event.inputs.enable_common || true }} \
            --build-arg ENABLE_STANDARD=${{ github.event.inputs.enable_standard || true }} \
            --build-arg ENABLE_VIRTTOOLS=${{ github.event.inputs.enable_virttools || true }} \
            --build-arg ENABLE_DEVTOOLS=${{ github.event.inputs.enable_devtools || true }} \
            --build-arg ENABLE_EXPERIMENTAL=${{ github.event.inputs.enable_experimental || false }} \
            --tag localhost/${{ env.IMAGE_NAME }}:build \
            "${LABEL_ARGS[@]}" \
            "${ANNOTATION_ARGS[@]}" \
            .

          # buildah derives org.opencontainers.image.base.* from whatever
          # container it commits, so the later label pass would record our own
          # intermediate :build tag as the base. Capture the real base here,
          # while it is still in local storage, and carry it forward.
          BASE_IMAGE="quay.io/fedora/fedora-kinoite:${{ github.event.inputs.fedora_version || '44' }}"
          BASE_INFO=$(sudo buildah inspect --type image "$BASE_IMAGE")
          BASE_DIGEST=$(jq -r '.FromImageDigest // empty' <<< "$BASE_INFO")
          BASE_VERSION=$(jq -r '.OCIv1.config.Labels["org.opencontainers.image.version"] // empty' <<< "$BASE_INFO")
          echo "Base image: ${BASE_IMAGE} (${BASE_VERSION:-unknown}) @ ${BASE_DIGEST:-unknown}"
          {
            echo "BASE_IMAGE=${BASE_IMAGE}"
            echo "BASE_DIGEST=${BASE_DIGEST}"
            echo "BASE_VERSION=${BASE_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Log image size
        run: |
          IMAGE_ID=$(sudo buildah images --format "{{.ID}}" localhost/${{ env.IMAGE_NAME }}:build | head -n 1)
          IMAGE_SIZE=$(sudo buildah images --format "{{.Size}}" localhost/${{ env.IMAGE_NAME }}:build | head -n 1)
          echo "Built image ID: $IMAGE_ID"
          echo "Image size: $IMAGE_SIZE"

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Run Rechunker (chunkah)
        id: rechunk
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event.inputs.rechunk || 'chunkah') == 'chunkah'
        uses: projectbluefin/actions/bootc-build/chunka@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          # Use the local-only tag, not the ghcr.io-qualified one: buildah's --from
          # treats a registry-qualified reference to a mutable tag (e.g. `:latest`)
          # as remotely resolvable and will pull it from GHCR instead of using the
          # image just built in local storage.
          source-image: "localhost/${{ env.IMAGE_NAME }}:build"
          max-layers: "128"

      - name: Run Rechunker (rpm-ostree)
        id: rechunk_rpm
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.inputs.rechunk == 'rpm-ostree'
        uses: projectbluefin/actions/bootc-build/rechunk@eb4c546389f19ad9e42f1af052623de73c620ebb # v1
        with:
          # Use the local-only tag, not the ghcr.io-qualified one: buildah's --from
          # treats a registry-qualified reference to a mutable tag (e.g. `:latest`)
          # as remotely resolvable and will pull it from GHCR instead of using the
          # image just built in local storage.
          source-image: "localhost/${{ env.IMAGE_NAME }}:build"
          output-image: "${{ env.IMAGE_NAME }}:rechunked"

      # Both rechunkers produce a new image that loses the metadata labels
      # applied during the build. Re-apply them to the final image so the
      # pushed tag carries the correct version/description regardless of
      # whether rechunking ran or not.
      - name: Apply metadata labels
        env:
          METADATA_LABELS: ${{ steps.metadata.outputs.labels }}
        run: |
          set -euo pipefail

          # Pick the image the pipeline actually produced: whichever rechunker
          # ran exposes an image-ref; if both were skipped (rechunk=none, or a
          # run where the rechunk guards didn't apply), fall back to :build.
          SOURCE_IMAGE="${{ steps.rechunk.outputs.image-ref }}"
          [ -n "$SOURCE_IMAGE" ] || SOURCE_IMAGE="${{ steps.rechunk_rpm.outputs.image-ref }}"
          [ -n "$SOURCE_IMAGE" ] || SOURCE_IMAGE="localhost/${{ env.IMAGE_NAME }}:build"
          echo "Applying labels on top of: $SOURCE_IMAGE"

          LABEL_ARGS=()
          ANNOTATION_ARGS=()
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            LABEL_ARGS+=(--label "$line")
            ANNOTATION_ARGS+=(--annotation "$line")
          done <<< "$METADATA_LABELS"

          # Point the base back at Kinoite: buildah would otherwise stamp the
          # intermediate image this commit is made from, and an explicit value
          # wins over the one it generates. Kinoite publishes no per-build tag,
          # so the exact base build is pinned by the digest and spelled out by
          # kinoite.version.
          for pair in \
              "org.opencontainers.image.base.name=${BASE_IMAGE:-}" \
              "org.opencontainers.image.base.digest=${BASE_DIGEST:-}" \
              "kinoite.version=${BASE_VERSION:-}"; do
            [ -n "${pair#*=}" ] || continue
            LABEL_ARGS+=(--label "$pair")
            ANNOTATION_ARGS+=(--annotation "$pair")
          done

          # buildah config operates on a working container, not directly on an
          # image, so create one from the source image first.
          CTR=$(sudo buildah from "$SOURCE_IMAGE")
          sudo buildah config "${LABEL_ARGS[@]}" "${ANNOTATION_ARGS[@]}" "$CTR"
          sudo buildah commit --rm --format oci "$CTR" localhost/${{ env.IMAGE_NAME }}:final
          echo "IMAGE_REF=containers-storage:localhost/${{ env.IMAGE_NAME }}:final" >> $GITHUB_ENV

          echo "Final labels:"
          sudo skopeo inspect containers-storage:localhost/${{ env.IMAGE_NAME }}:final | jq '.Labels'
          echo "Final annotations:"
          sudo skopeo inspect --raw containers-storage:localhost/${{ env.IMAGE_NAME }}:final | jq '.annotations'

      # Copying out of containers-storage recompresses the layers on every call,
      # which yields a different manifest digest each time and would publish the
      # same content as several distinct package versions. Copy once, capture the
      # digest, then point the remaining tags at that same manifest with
      # registry-to-registry copies.
      - name: Push To GHCR
        id: push_ghcr
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail

          REPO="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAGS=(${{ steps.metadata.outputs.tags }})

          echo "${{ secrets.GITHUB_TOKEN }}" | sudo skopeo login ghcr.io -u ${{ github.actor }} --password-stdin

          sudo skopeo copy --digestfile /tmp/ghcr-digest \
            ${{ env.IMAGE_REF }} \
            "docker://${REPO}:${TAGS[0]}"
          DIGEST=$(cat /tmp/ghcr-digest)
          echo "Pushed ${REPO}:${TAGS[0]} -> ${DIGEST}"

          for tag in "${TAGS[@]:1}"; do
            sudo skopeo copy "docker://${REPO}@${DIGEST}" "docker://${REPO}:${tag}"
            echo "Tagged ${REPO}:${tag} -> ${DIGEST}"
          done

          echo "repo=${REPO}" >> $GITHUB_OUTPUT
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "ref=docker://${REPO}@${DIGEST}" >> $GITHUB_OUTPUT

      - name: Delete old images from GHCR
        if: steps.push_ghcr.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ env.IMAGE_NAME }}
          KEEP_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          set -euo pipefail

          CUTOFF_DATE=$(date -u -d '30 days ago' +%s)
          echo "Fetching versions for ${PACKAGE_NAME}..."

          # `gh api` paginates on its own and fails the step on a non-2xx response,
          # unlike a bare `curl -s`. The default tag is excluded by exact array
          # membership rather than a substring match on the joined list, so tags
          # such as `latest-foo` are no longer treated as protected.
          gh api --paginate "/user/packages/container/${PACKAGE_NAME}/versions" \
            --jq ".[]
                  | select((.metadata.container.tags // []) | index(\"${KEEP_TAG}\") | not)
                  | [.id, .updated_at, ((.metadata.container.tags // []) | join(\",\"))]
                  | @tsv" \
          | while IFS=$'\t' read -r VERSION_ID UPDATED_AT TAGS; do
              VERSION_TS=$(date -u -d "$UPDATED_AT" +%s 2>/dev/null || echo 0)
              [ "$VERSION_TS" -lt "$CUTOFF_DATE" ] || continue

              echo "Deleting version ID: ${VERSION_ID} (tags: ${TAGS:-<untagged>}, updated: ${UPDATED_AT})"
              gh api --silent --method DELETE \
                "/user/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}"
            done

          echo "GHCR cleanup complete."

      - name: Login to Docker Hub
        if: steps.push_ghcr.outcome == 'success' && steps.date.outputs.push_dockerhub == 'true'
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo skopeo login docker.io \
            -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # Mirroring from the GHCR digest instead of containers-storage keeps the same
      # manifest digest across all registries and skips a full re-upload.
      - name: Push To Docker Hub
        id: push_dockerhub
        if: steps.push_ghcr.outcome == 'success' && steps.date.outputs.push_dockerhub == 'true'
        run: |
          set -euo pipefail
          SRC="${{ steps.push_ghcr.outputs.ref }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            sudo skopeo copy "$SRC" docker://docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:$tag
          done

      - name: Delete old images from Docker Hub
        if: steps.push_dockerhub.outcome == 'success' && steps.date.outputs.push_dockerhub == 'true'
        run: |
          DOCKERHUB_REPO="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          CUTOFF_DATE=$(date -u -d '15 days ago' +%s)

          # Get auth token for listing tags
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -X POST -d '{"username": "${{ secrets.DOCKERHUB_USERNAME }}", "password": "${{ secrets.DOCKERHUB_TOKEN }}"}' \
            "https://hub.docker.com/v2/users/login/" | jq -r '.token')

          echo "Fetching tags for ${DOCKERHUB_REPO}..."
          PAGE_URL="https://hub.docker.com/v2/repositories/${DOCKERHUB_REPO}/tags/?page_size=100"
          while [ "$PAGE_URL" != "null" ] && [ -n "$PAGE_URL" ]; do
            RESPONSE=$(curl -s -H "Authorization: Bearer ${TOKEN}" "$PAGE_URL")

            echo "$RESPONSE" | jq -c '.results[]?' | while read -r TAG; do
              TAG_NAME=$(echo "$TAG" | jq -r '.name')
              LAST_UPDATED=$(echo "$TAG" | jq -r '.last_updated')
              TAG_TS=$(date -u -d "$LAST_UPDATED" +%s 2>/dev/null || echo 0)

              # Skip the default tag
              if [ "$TAG_NAME" = "${{ env.DEFAULT_TAG }}" ]; then
                continue
              fi

              if [ "$TAG_TS" -lt "$CUTOFF_DATE" ] 2>/dev/null; then
                echo "Deleting tag: ${TAG_NAME} (updated: ${LAST_UPDATED})"
                sudo skopeo delete docker://docker.io/${DOCKERHUB_REPO}:${TAG_NAME}
              fi
            done

            PAGE_URL=$(echo "$RESPONSE" | jq -r '.next // "null"')
          done

          echo "Docker Hub cleanup complete."

      - name: Login to Quay.io
        if: steps.push_ghcr.outcome == 'success' && steps.date.outputs.push_quay == 'true'
        run: |
          echo "${{ secrets.QUAY_TOKEN }}" | sudo skopeo login quay.io \
            -u ${{ secrets.QUAY_USERNAME }} --password-stdin

      - name: Push To Quay.io
        id: push_quay
        if: steps.push_ghcr.outcome == 'success' && steps.date.outputs.push_quay == 'true'
        run: |
          set -euo pipefail
          SRC="${{ steps.push_ghcr.outputs.ref }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            sudo skopeo copy "$SRC" docker://quay.io/${{ secrets.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:$tag
          done

      - name: Delete old images from Quay.io
        if: steps.push_quay.outcome == 'success' && steps.date.outputs.push_quay == 'true'
        run: |
          QUAY_REPO="${{ secrets.QUAY_NAMESPACE }}/${{ env.IMAGE_NAME }}"
          CUTOFF_DATE=$(date -u -d '15 days ago' +%s)

          echo "Fetching tags for ${QUAY_REPO}..."
          PAGE=1
          while true; do
            RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.QUAY_TOKEN }}" \
              "https://quay.io/api/v1/repository/${QUAY_REPO}/tag/?page=${PAGE}&limit=100&onlyActiveTags=true")

            TAGS=$(echo "$RESPONSE" | jq -r '.tags[]? | select(.name != "${{ env.DEFAULT_TAG }}") | "\(.name) \(.start_ts)"')

            if [ -z "$TAGS" ]; then
              break
            fi

            echo "$TAGS" | while read -r TAG_NAME TAG_TS; do
              if [ "$TAG_TS" -lt "$CUTOFF_DATE" ] 2>/dev/null; then
                echo "Deleting tag: ${TAG_NAME} (created: $(date -u -d @${TAG_TS} +%Y-%m-%d))"
                sudo skopeo delete docker://quay.io/${QUAY_REPO}:${TAG_NAME}
              fi
            done

            HAS_MORE=$(echo "$RESPONSE" | jq -r '.has_additional // false')
            if [ "$HAS_MORE" != "true" ]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          echo "Cleanup complete."
