---
name: Build container image (dev)
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      fedora_version:
        description: "Fedora base image"
        required: false
        default: "45"
        type: choice
        options:
          - "44"
          - "45"
          - "rawhide"
      rechunk:
        description: "Rechunk method"
        required: false
        default: "none"
        type: choice
        options:
          - "none"
          - "rpm-ostree"
          - "chunkah"

env:
  IMAGE_DESC: "HorizonOS - Customized Fedora Kinoite Image (Dev)"
  IMAGE_KEYWORDS: "bootc,fedora,kinoite,atomic,dev"
  IMAGE_LOGO_URL: "https://github.com/itotm/horizon-os/blob/main/logo.png"
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "dev"
  # Public half of SIGNING_SECRET; installed into the image from sys_files.
  COSIGN_PUBLIC_KEY: "sys_files/etc/pki/containers/horizon-os.pub"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get current date and version
        id: date
        run: |
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT
          BUILD_DATE=$(date -u +%Y%m%d)
          BUILD_NUMBER=${{ github.run_number }}
          VERSION="${BUILD_DATE}.${BUILD_NUMBER}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ steps.date.outputs.version }}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=true
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Build Image
        id: build_image
        # Labels are passed through the environment rather than interpolated
        # directly into the script: the value is multi-line and user-controlled.
        env:
          METADATA_LABELS: ${{ steps.metadata.outputs.labels }}
        run: |
          set -euo pipefail

          LABEL_ARGS=()
          ANNOTATION_ARGS=()
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            LABEL_ARGS+=(--label "$line")
            ANNOTATION_ARGS+=(--annotation "$line")
          done <<< "$METADATA_LABELS"

          # --format oci is buildah's default, but stating it explicitly guards
          # against a Docker-format manifest, where --annotation is silently dropped.
          sudo buildah build \
            --format oci \
            --file ./Containerfile \
            --build-arg FEDORA_VERSION=${{ github.event.inputs.fedora_version || '45' }} \
            --build-arg BUILD_NUMBER=${{ github.run_number }} \
            --build-arg IMAGE_VERSION=${{ steps.date.outputs.version }} \
            --build-arg ENABLE_COMMON=true \
            --build-arg ENABLE_STANDARD=true \
            --build-arg ENABLE_VIRTTOOLS=true \
            --build-arg ENABLE_DEVTOOLS=true \
            --build-arg ENABLE_EXPERIMENTAL=false \
            --tag localhost/${{ env.IMAGE_NAME }}:build \
            "${LABEL_ARGS[@]}" \
            "${ANNOTATION_ARGS[@]}" \
            .

          # buildah derives org.opencontainers.image.base.* from whatever
          # container it commits, so the later label pass would record our own
          # intermediate :build tag as the base. Capture the real base here,
          # while it is still in local storage, and carry it forward.
          BASE_IMAGE="quay.io/fedora/fedora-kinoite:${{ github.event.inputs.fedora_version || '45' }}"
          BASE_INFO=$(sudo buildah inspect --type image "$BASE_IMAGE")
          BASE_DIGEST=$(jq -r '.FromImageDigest // empty' <<< "$BASE_INFO")
          BASE_VERSION=$(jq -r '.OCIv1.config.Labels["org.opencontainers.image.version"] // empty' <<< "$BASE_INFO")
          echo "Base image: ${BASE_IMAGE} (${BASE_VERSION:-unknown}) @ ${BASE_DIGEST:-unknown}"
          {
            echo "BASE_IMAGE=${BASE_IMAGE}"
            echo "BASE_DIGEST=${BASE_DIGEST}"
            echo "BASE_VERSION=${BASE_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Log image size
        run: |
          IMAGE_ID=$(sudo buildah images --format "{{.ID}}" localhost/${{ env.IMAGE_NAME }}:build | head -n 1)
          IMAGE_SIZE=$(sudo buildah images --format "{{.Size}}" localhost/${{ env.IMAGE_NAME }}:build | head -n 1)
          echo "Built image ID: $IMAGE_ID"
          echo "Image size: $IMAGE_SIZE"

      - name: Run Rechunker (chunka)
        env:
          RUST_LOG: chunkah=debug
        id: rechunk
        # Only run on manual dispatch with the option explicitly enabled.
        # Scheduled builds and manual runs with the default (none) skip it.
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rechunk == 'chunkah' }}
        uses: projectbluefin/actions/bootc-build/chunka@837850b6100b22c7920476035e7e1c28fdbba67f # v1
        with:
          # Use the local-only tag, not the ghcr.io-qualified one: buildah's --from
          # treats a registry-qualified reference to a mutable tag (e.g. `:dev`)
          # as remotely resolvable and will pull it from GHCR instead of using the
          # image just built in local storage.
          source-image: "localhost/${{ env.IMAGE_NAME }}:build"
          max-layers: "128"

      - name: Run Rechunker (rpm-ostree)
        id: rechunk_rpm
        # Only run on manual dispatch with the option explicitly enabled.
        # Scheduled builds and manual runs with the default (none) skip it.
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.rechunk == 'rpm-ostree' }}
        uses: projectbluefin/actions/bootc-build/rechunk@d0d12d2577eb5a629b411ba86973f971bc0639a3 # v1
        with:
          # Use the local-only tag, not the ghcr.io-qualified one: buildah's --from
          # treats a registry-qualified reference to a mutable tag (e.g. `:dev`)
          # as remotely resolvable and will pull it from GHCR instead of using the
          # image just built in local storage.
          source-image: "localhost/${{ env.IMAGE_NAME }}:build"
          output-image: "${{ env.IMAGE_NAME }}:rechunked"
          max-layers: "128"

      # The rechunker (chunka) produces a new image that loses the metadata
      # labels applied during the build. Re-apply them to the final image so
      # the pushed tag carries the correct version/description regardless of
      # whether rechunking ran or not.
      - name: Apply metadata labels
        env:
          METADATA_LABELS: ${{ steps.metadata.outputs.labels }}
        run: |
          set -euo pipefail

          RECHUNK_MODE="${{ github.event.inputs.rechunk || 'none' }}"
          if [ "$RECHUNK_MODE" = "chunkah" ]; then
            SOURCE_IMAGE="${{ steps.rechunk.outputs.image-ref }}"
          elif [ "$RECHUNK_MODE" = "rpm-ostree" ]; then
            SOURCE_IMAGE="${{ steps.rechunk_rpm.outputs.image-ref }}"
          else
            SOURCE_IMAGE="localhost/${{ env.IMAGE_NAME }}:build"
          fi
          echo "Applying labels on top of: $SOURCE_IMAGE"

          LABEL_ARGS=()
          ANNOTATION_ARGS=()
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            LABEL_ARGS+=(--label "$line")
            ANNOTATION_ARGS+=(--annotation "$line")
          done <<< "$METADATA_LABELS"

          # Point the base back at Kinoite: buildah would otherwise stamp the
          # intermediate image this commit is made from, and an explicit value
          # wins over the one it generates. Kinoite publishes no per-build tag,
          # so the exact base build is pinned by the digest and spelled out by
          # kinoite.version.
          for pair in \
              "org.opencontainers.image.base.name=${BASE_IMAGE:-}" \
              "org.opencontainers.image.base.digest=${BASE_DIGEST:-}" \
              "kinoite.version=${BASE_VERSION:-}"; do
            [ -n "${pair#*=}" ] || continue
            LABEL_ARGS+=(--label "$pair")
            ANNOTATION_ARGS+=(--annotation "$pair")
          done

          # buildah config operates on a working container, not directly on an
          # image, so create one from the source image first.
          CTR=$(sudo buildah from "$SOURCE_IMAGE")
          sudo buildah config "${LABEL_ARGS[@]}" "${ANNOTATION_ARGS[@]}" "$CTR"
          sudo buildah commit --rm --format oci "$CTR" localhost/${{ env.IMAGE_NAME }}:final
          echo "IMAGE_REF=containers-storage:localhost/${{ env.IMAGE_NAME }}:final" >> $GITHUB_ENV

          echo "Final labels:"
          sudo skopeo inspect containers-storage:localhost/${{ env.IMAGE_NAME }}:final | jq '.Labels'
          echo "Final annotations:"
          sudo skopeo inspect --raw containers-storage:localhost/${{ env.IMAGE_NAME }}:final | jq '.annotations'

      # Same signing chain as build.yml: `dev` lives in the same repository as
      # `latest`, and the policy shipped in the image covers the whole
      # repository, so an unsigned dev build could not be switched to from an
      # installed system.
      - name: Install Cosign
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Check signing key
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          cosign public-key --key env://COSIGN_PRIVATE_KEY | diff - "$COSIGN_PUBLIC_KEY"
          echo "SIGNING_SECRET matches ${COSIGN_PUBLIC_KEY}"

      # cosign reads ~/.docker/config.json and never sees the credentials
      # `sudo podman login` stores under /run/containers/0/auth.json.
      - name: Login to GHCR (for cosign)
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Copy out of containers-storage once and point any further tag at that
      # digest: every copy from local storage recompresses the layers and would
      # yield a different manifest, which a single signature could not cover.
      - name: Push To GHCR
        id: push_ghcr
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          REPO="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAGS=(${{ steps.metadata.outputs.tags }})

          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

          sudo skopeo copy --digestfile /tmp/ghcr-digest ${{ env.IMAGE_REF }} "docker://${REPO}:${TAGS[0]}"
          DIGEST=$(cat /tmp/ghcr-digest)
          echo "Pushed ${REPO}:${TAGS[0]} -> ${DIGEST}"

          for tag in "${TAGS[@]:1}"; do
            sudo skopeo copy "docker://${REPO}@${DIGEST}" "docker://${REPO}:${tag}"
            echo "Tagged ${REPO}:${tag} -> ${DIGEST}"
          done

          echo "repo=${REPO}" >> $GITHUB_OUTPUT
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      # See build.yml for why the two compatibility flags are needed.
      - name: Sign image (GHCR)
        if: steps.push_ghcr.outcome == 'success'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          SIGN_REF: ${{ steps.push_ghcr.outputs.repo }}@${{ steps.push_ghcr.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "$SIGN_REF"
          cosign verify --key "$COSIGN_PUBLIC_KEY" "$SIGN_REF"
