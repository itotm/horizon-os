# zswap: compressed cache in RAM in front of /var/swap/swapfile (horizon-swapfile).
# zstd is a module in Fedora's kernel, so zswap.compressor=zstd on the kernel
# command line would fall back to lzo; set here, the module is loaded on demand.
w /sys/module/zswap/parameters/compressor - - - - zstd
w /sys/module/zswap/parameters/enabled - - - - Y
